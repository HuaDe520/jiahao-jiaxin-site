<head>

</head>
<body class="ac-page">

<!-- ============ 页头 ============ -->
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html" aria-label="返回首页">
      <img class="brand__logo" src="assets/img/logo-main.png" alt="浙江嘉豪嘉欣协会会徽" width="46" height="46" decoding="async">
      <span class="brand__text">
        <strong>浙江嘉豪嘉欣协会</strong>
        <small>ZHEJIANG JIAHAO JIAXIN ASSOCIATION</small>
      </span>
    </a>
<a class="nav-quick" href="friends.html" aria-label="好友与聊天" title="好友与聊天">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.6 20.5v-1.7a3.7 3.7 0 0 0-3.7-3.7H7.2a3.7 3.7 0 0 0-3.7 3.7v1.7"></path>
        <circle cx="9.6" cy="7.7" r="3.5"></circle>
        <path d="M20.6 20.5v-1.7a3.7 3.7 0 0 0-2.8-3.6"></path>
        <path d="M15.1 4.3a3.5 3.5 0 0 1 0 6.8"></path>
      </svg>
    </a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="展开导航菜单">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav site-nav--plain" id="siteNav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="workbench.html">嘉庭工作台</a>
      <a href="app.html">下载 App</a>
      <a href="account.html">我的账号</a>
    </nav>
  </div>
</header>

<main>
  <section class="section" style="padding-top:52px">
    <div class="wrap">
      <header class="section__head">
        <p class="eyebrow"><span class="eyebrow__line"></span>成员主页</p>
        <h2 id="pfTitle">看看这位成员</h2>
      </header>

      <div class="pf-stage">

        <!-- 没登录 -->
        <div class="pf-card" id="pfGuest" hidden>
          <div class="fr-empty">先到「我的账号」用昵称 + 密码进来，才能看别人的主页。</div>
          <div style="text-align:center"><a class="fr-btn" href="account.html">去我的账号</a></div>
        </div>

        <!-- 加载中 -->
        <div class="pf-card" id="pfLoading">
          <div class="fr-empty">正在打开主页…</div>
        </div>

        <!-- 出错 -->
        <div class="pf-card" id="pfError" hidden>
          <div class="fr-empty" id="pfErrorText">没找到这个人。</div>
          <div style="text-align:center"><a class="fr-btn fr-btn--ghost" href="friends.html">回好友页</a></div>
        </div>

        <!-- 主页内容 -->
        <div class="pf-card" id="pfMain" hidden>
          <div class="pf-head">
            <button class="pf-avatar" id="pfAvatarBtn" type="button" title="看大头像">
              <img id="pfAvatar" alt="">
            </button>
            <div class="pf-head__text">
              <h3 class="pf-name" id="pfName">—</h3>
              <div class="pf-tags" id="pfTags"></div>
              <p class="pf-since" id="pfSince"></p>
            </div>
          </div>

          <div class="pf-field">
            <span class="pf-field__label">个人签名</span>
            <p class="pf-sign" id="pfSign">这个人很神秘，什么都没写。</p>
          </div>

          <div class="pf-actions" id="pfActions"></div>
          <div class="pf-msg" id="pfMsg"></div>

          <p class="pf-foot" id="pfFoot"></p>
        </div>

      </div>
    </div>
  </section>
</main>

<!-- ============ 页脚 ============ -->
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__brand">
      <img src="assets/img/logo-main.png" alt="" aria-hidden="true" width="56" height="56" loading="lazy" decoding="async">
      <div>
        <strong>浙江嘉豪嘉欣协会</strong>
        <p>浙江高校生兴趣社交社群 · 非营利自组织</p>

    </div>
    <nav class="site-footer__nav" aria-label="页面导航">

      <a href="friends.html">好友</a>
      <a href="comfort.html">安慰盲盒</a>
      <a href="app.html">下载 App</a>
    </nav>
    <div class="site-footer__meta">
      <p>本页面仅用于协会对外展示，内容以群内公告为准。</p>
      <p>&copy; <span id="year">2026</span> 浙江嘉豪嘉欣协会 · 保留所有权利</p>
    </div>
  </div>
</footer>

  <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.6 12 3.2l9 7.4"></path>
    <path d="M5.6 9.6V20h12.8V9.6"></path>
    <path d="M9.7 20v-5.3h4.6V20"></path>
  </svg>
  <span>返回首页</span>
</a>

<script src="assets/js/api.js?v=7fa27886"></script>
<script src="assets/js/profile.js?v=f0e79c94"></script>
<script>
  var y = document.getElementById('year');
  if (y) { y.textContent = String(new Date().getFullYear()); }
</script>
<script src="assets/js/nav.js?v=3e4a4fc6"></script>
</body>
</html>
