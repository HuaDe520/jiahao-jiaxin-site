<script>
(function () {
  'use strict';

  /* 九个功能模块（名称取自部门名，但这里是工作台的功能模块） */
  var MODULES = [
    { key: 'shutong', name: '嘉枢', logo: 'assets/img/dept-01-shutong.png', tools: [] },
    { key: 'fanxun',  name: '嘉番', logo: 'assets/img/dept-02-fanxun.png', tools: [] },
    { key: 'youlun',  name: '嘉游', logo: 'assets/img/dept-03-youlun.png', tools: [
        {
          name: '贪吃蛇',
          desc: '电脑用方向键，手机在棋盘上滑动',
          href: 'snake.html',
          icon: '🐍'
        }
      ] },
    { key: 'mohui',   name: '嘉墨', logo: 'assets/img/dept-04-mohui.png', tools: [] },
    { key: 'lixing',  name: '嘉体', logo: 'assets/img/dept-05-lixing.png', tools: [] },
    { key: 'tongyou', name: '嘉盟', logo: 'assets/img/dept-06-tongyou.png', tools: [] },
    { key: 'xianfu',  name: '嘉闲', logo: 'assets/img/dept-07-xianfu.png', tools: [
        {
          name: '可以耽误10秒钟吗？',
          desc: '不好意思，打扰了',
          href: 'tenseconds.html',
          icon: '⏳'
        }
      ] },
    { key: 'qingtan', name: '嘉学', logo: 'assets/img/dept-08-qingtan.png', tools: [
        {
          name: '学习计算器',
          desc: '基础运算、求导、不定积分、定积分、极限、解方程',
          href: 'calc.html',
          icon: '∑'
        },
        {
          name: '千词奇域',
          desc: '四级 / 六级词库，挑释义背单词',
          href: 'qianci.html',
          icon: '📖'
        }
      ] },
    { key: 'jieyou',  name: '嘉窗', logo: 'assets/img/dept-09-jieyou.png', tools: [
        {
          name: '安慰盲盒',
          desc: '给你一句安慰与鼓励',
          href: 'comfort.html',
          icon: '☀'
        },
        {
          name: '树洞纸条',
          desc: '匿名写下心事，投入树洞中',
          href: 'treehole.html',
          icon: '✉'
        }
      ] }
  ];

  var grid = document.getElementById('wbGrid');
  var detail = document.getElementById('wbDetail');

  function find(key) {
    for (var i = 0; i < MODULES.length; i++) { if (MODULES[i].key === key) return MODULES[i]; }
    return null;
  }

  function renderGrid(activeKey) {
    grid.innerHTML = '';
    MODULES.forEach(function (d) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wb-dept' + (d.key === activeKey ? ' is-active' : '');
      btn.setAttribute('data-dept', d.key);

      var img = document.createElement('img');
      img.src = d.logo;
      img.alt = d.name + '模块图标';
      img.loading = 'lazy';
      btn.appendChild(img);

      var strong = document.createElement('strong');
      strong.textContent = d.name;
      btn.appendChild(strong);

      var em = document.createElement('em');
      if (d.tools.length) {
        em.className = 'is-ready';
        em.textContent = d.tools.length + ' 个工具';
      } else {
        em.textContent = '建设中';
      }
      btn.appendChild(em);

      btn.addEventListener('click', function () {
        if (location.hash === '#' + d.key) { render(d.key); }
        else { location.hash = '#' + d.key; }
      });
      grid.appendChild(btn);
    });
  }

  function render(key) {
    var d = find(key) || MODULES[0];
    renderGrid(d.key);
    detail.innerHTML = '';

    var head = document.createElement('div');
    head.className = 'wb-detail__head';
    var img = document.createElement('img');
    img.src = d.logo;
    img.alt = d.name + '模块图标';
    head.appendChild(img);
    var box = document.createElement('div');
    var h3 = document.createElement('h3');
    h3.textContent = d.name;
    var p = document.createElement('p');
    p.textContent = d.tools.length ? '可用工具 ' + d.tools.length + ' 个' : '该模块工具正在筹备';
    box.appendChild(h3);
    box.appendChild(p);
    head.appendChild(box);
    detail.appendChild(head);

    if (d.tools.length) {
      var wrap = document.createElement('div');
      wrap.className = 'wb-tools';
      d.tools.forEach(function (t) {
        var a = document.createElement('a');
        a.className = 'wb-tool';
        a.href = t.href;

        var icon = document.createElement('span');
        icon.className = 'wb-tool__icon';
        icon.textContent = t.icon || '·';
        a.appendChild(icon);

        var body = document.createElement('span');
        body.className = 'wb-tool__body';
        var strong = document.createElement('strong');
        strong.textContent = t.name;
        var desc = document.createElement('span');
        desc.textContent = t.desc;
        body.appendChild(strong);
        body.appendChild(desc);
        a.appendChild(body);

        var arrow = document.createElement('span');
        arrow.className = 'wb-tool__arrow';
        arrow.textContent = '→';
        a.appendChild(arrow);

        wrap.appendChild(a);
      });
      detail.appendChild(wrap);
    } else {
      var empty = document.createElement('div');
      empty.className = 'wb-empty';
      var strong = document.createElement('strong');
      strong.textContent = '功能建设中';
      var p2 = document.createElement('p');
      p2.textContent = '该模块的便捷工具正在筹备，上线后会在这里出现，敬请期待。';
      empty.appendChild(strong);
      empty.appendChild(p2);
      detail.appendChild(empty);
    }
  }

  function fromHash() {
    render((location.hash || '#shutong').replace('#', ''));
  }

  window.addEventListener('hashchange', fromHash);
  fromHash();

  var y = document.getElementById('year');
  if (y) { y.textContent = String(new Date().getFullYear()); }
})();
</script>
