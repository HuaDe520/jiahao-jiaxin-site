  </div>
</footer>

<script>
(function () {
  'use strict';

  /* 九个部门与它们的工具（tools 为空表示功能建设中） */
  var DEPTS = [
    { key: 'shutong', short: '嘉枢', full: '嘉枢统筹部', logo: 'assets/img/dept-01-shutong.png', tools: [] },
    { key: 'fanxun',  short: '嘉番', full: '嘉番巡礼部', logo: 'assets/img/dept-02-fanxun.png', tools: [] },
    { key: 'youlun',  short: '嘉游', full: '嘉游论衡部', logo: 'assets/img/dept-03-youlun.png', tools: [] },
    { key: 'mohui',   short: '嘉墨', full: '嘉墨绘梦部', logo: 'assets/img/dept-04-mohui.png', tools: [] },
    { key: 'lixing',  short: '嘉体', full: '嘉体砺行部', logo: 'assets/img/dept-05-lixing.png', tools: [] },
    { key: 'tongyou', short: '嘉盟', full: '嘉盟同游部', logo: 'assets/img/dept-06-tongyou.png', tools: [] },
    { key: 'xianfu',  short: '嘉闲', full: '嘉闲浮生部', logo: 'assets/img/dept-07-xianfu.png', tools: [] },
    { key: 'qingtan', short: '嘉学', full: '嘉学清谈部', logo: 'assets/img/dept-08-qingtan.png', tools: [
        {
          name: '学习计算器',
          desc: '基础运算、求导、不定积分、定积分、极限、解方程',
          href: 'calc.html',
          icon: '∑'
        }
      ] },
    { key: 'jieyou',  short: '嘉窗', full: '嘉窗解忧部', logo: 'assets/img/dept-09-jieyou.png', tools: [] }
  ];

  var grid = document.getElementById('wbGrid');
  var detail = document.getElementById('wbDetail');

  function find(key) {
    for (var i = 0; i < DEPTS.length; i++) { if (DEPTS[i].key === key) return DEPTS[i]; }
    return null;
  }

  function renderGrid(activeKey) {
    grid.innerHTML = '';
    DEPTS.forEach(function (d) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wb-dept' + (d.key === activeKey ? ' is-active' : '');
      btn.setAttribute('data-dept', d.key);

      var img = document.createElement('img');
      img.src = d.logo;
      img.alt = d.full + '部徽';
      img.loading = 'lazy';
      btn.appendChild(img);

      var strong = document.createElement('strong');
      strong.textContent = d.short;
      btn.appendChild(strong);

      var span = document.createElement('span');
      span.textContent = d.full;
      btn.appendChild(span);

      var em = document.createElement('em');
      if (d.tools.length) {
        em.className = 'is-ready';
        em.textContent = d.tools.length + ' 个工具';
      } else {
        em.textContent = '建设中';
      }
      btn.appendChild(em);

      btn.addEventListener('click', function () {
        if (location.hash === '#' + d.key) { render(d.key); }
        else { location.hash = '#' + d.key; }
      });
      grid.appendChild(btn);
    });
  }

  function render(key) {
    var d = find(key) || DEPTS[0];
    renderGrid(d.key);
    detail.innerHTML = '';

    var head = document.createElement('div');
    head.className = 'wb-detail__head';
    var img = document.createElement('img');
    img.src = d.logo;
    img.alt = d.full + '部徽';
    head.appendChild(img);
    var box = document.createElement('div');
    var h3 = document.createElement('h3');
    h3.textContent = d.full;
    var p = document.createElement('p');
    p.textContent = d.tools.length ? '可用工具 ' + d.tools.length + ' 个' : '该部门工具正在筹备';
    box.appendChild(h3);
    box.appendChild(p);
    head.appendChild(box);
    detail.appendChild(head);

    if (d.tools.length) {
      var wrap = document.createElement('div');
      wrap.className = 'wb-tools';
      d.tools.forEach(function (t) {
        var a = document.createElement('a');
        a.className = 'wb-tool';
        a.href = t.href;

        var icon = document.createElement('span');
        icon.className = 'wb-tool__icon';
        icon.textContent = t.icon || '·';
        a.appendChild(icon);

        var body = document.createElement('span');
        body.className = 'wb-tool__body';
        var strong = document.createElement('strong');
        strong.textContent = t.name;
        var desc = document.createElement('span');
        desc.textContent = t.desc;
        body.appendChild(strong);
        body.appendChild(desc);
        a.appendChild(body);

        var arrow = document.createElement('span');
        arrow.className = 'wb-tool__arrow';
        arrow.textContent = '→';
        a.appendChild(arrow);

        wrap.appendChild(a);
      });
      detail.appendChild(wrap);
    } else {
      var empty = document.createElement('div');
      empty.className = 'wb-empty';
      var strong = document.createElement('strong');
      strong.textContent = '功能建设中';
      var p2 = document.createElement('p');
      p2.textContent = '该部门的便捷工具正在筹备，上线后会在这里出现，敬请期待。';
      empty.appendChild(strong);
      empty.appendChild(p2);
      detail.appendChild(empty);
    }
  }

  function fromHash() {
    render((location.hash || '#shutong').replace('#', ''));
  }

  window.addEventListener('hashchange', fromHash);
  fromHash();

  var y = document.getElementById('year');
  if (y) { y.textContent = String(new Date().getFullYear()); }
})();
</script>
</body>
