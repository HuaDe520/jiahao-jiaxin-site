<main>
  <section class="section" style="padding-top:48px">
    <div class="wrap">
      <header class="section__head" style="margin-bottom:28px">
        <p class="eyebrow"><span class="eyebrow__line"></span>协会账号</p>
        <h2>好友与聊天</h2>
      </header>

      <div class="fr-stage">

        <!-- 没登录 -->
        <div class="fr-card" id="frGuest" hidden>
          <div class="fr-empty">先到「我的账号」填昵称和邀请码进来，这里就能加好友、聊天了。</div>
          <div style="text-align:center"><button class="fr-btn" id="frToAccount" type="button">去我的账号</button></div>
        </div>

        <!-- 已登录 -->
        <div id="frMain" hidden>
          <div class="fr-me">
            <img class="fr-me__avatar" id="frAvatar" alt="">
            <div>
              <div class="fr-me__name" id="frName">—</div>
              <div class="fr-me__meta" id="frMeta">—</div>
            </div>
            <span class="fr-me__unread" id="frUnread"></span>
          </div>

          <div class="fr-tabs">
            <button class="fr-tab is-active" id="frTabFriends" type="button">好友</button>
            <button class="fr-tab" id="frTabGroups" type="button">群聊 <em id="frGroupBadge" hidden>0</em></button>
            <button class="fr-tab" id="frTabRequests" type="button">好友请求 <em id="frReqBadge" hidden>0</em></button>
            <button class="fr-tab" id="frTabSearch" type="button">找人</button>
          </div>

          <!-- 好友 / 会话 -->
          <div class="fr-card" id="frPaneFriends">
            <div id="frFriends"></div>
          </div>

          <!-- 群聊 -->
          <div class="fr-card" id="frPaneGroups" hidden>
            <div class="fr-groups__head">
              <button class="fr-btn" id="frGroupCreate" type="button">创建群聊</button>
              <button class="fr-btn fr-btn--ghost" id="frGroupJoin" type="button">加入群聊</button>
              <span class="fr-groups__hint">拉几个好友一起聊，知道群号也能加</span>
            </div>
            <div class="fr-msg" id="frGroupMsg"></div>
            <div id="frGroups"></div>
          </div>

          <!-- 聊天 -->
          <div class="fr-card" id="frPaneChat" hidden>
            <div class="fr-chat">
              <div class="fr-chat__head">
                <img id="frChatAvatar" alt="" title="看主页">
                <span class="fr-chat__who">
                  <span class="fr-chat__name" id="frChatName">—</span>
                  <span class="fr-chat__meta" id="frChatMeta" hidden></span>
                </span>
                <span class="fr-chat__tools">
                  <button class="fr-btn fr-btn--ghost" id="frChatMore" type="button" hidden>群设置</button>
                  <button class="fr-btn fr-btn--ghost" id="frChatMembers" type="button" hidden>成员</button>
                  <button class="fr-btn fr-btn--ghost" id="frChatRefresh" type="button">刷新</button>
                  <button class="fr-btn fr-btn--ghost" id="frChatBack" type="button">返回</button>
                </span>
              </div>
              <!-- 群公告：长公告折起来，点一下展开（群里每个人都看得到） -->
              <div class="fr-notice" id="frChatNotice" hidden></div>
              <div class="fr-members" id="frMemberPanel" hidden></div>
              <div class="fr-chat__wrap">
                <div class="fr-chat__list" id="frChatList"></div>
                <button class="fr-chat__tobottom" id="frChatToBottom" type="button" hidden>有新消息 ↓</button>
              </div>
              <div class="fr-chat__bar">
                <span class="fr-chat__tip">自己发的消息 2 分钟内可以点「撤回」</span>
                <span class="fr-chat__styles" id="frChatStyles" role="group" aria-label="气泡风格">
                  <span class="fr-chat__style-name" id="frChatStyleName">青绿</span>
                  <button class="fr-style-dot" type="button" data-theme="jade" title="青绿（默认）" aria-label="青绿"></button>
                  <button class="fr-style-dot" type="button" data-theme="ink" title="简约" aria-label="简约"></button>
                  <button class="fr-style-dot" type="button" data-theme="night" title="夜间" aria-label="夜间"></button>
                  <button class="fr-style-dot" type="button" data-theme="candy" title="暖阳" aria-label="暖阳"></button>
                  <button class="fr-style-dot" type="button" data-theme="paper" title="纸感" aria-label="纸感"></button>
                  <button class="fr-style-dot" type="button" data-theme="supreme" title="至尊" aria-label="至尊"></button>
                </span>
              </div>
              <!-- 录音失败、附件太大这类提示显示在这里（比 alert 友好，手机上也能看清） -->
              <div class="fr-msg" id="frChatMsg"></div>
              <!-- 全员禁言：普通成员在这里看到为什么发不出去 -->
              <div class="fr-mute" id="frChatMute" hidden>群主开了全员禁言，这会儿只有群主和管理员能发言</div>
              <div class="fr-chat__foot">
                <div class="fr-media-bar" role="group" aria-label="发送图片、语音或文件">
                  <button class="fr-media-btn" id="frChatImage" type="button" title="发图片" aria-label="发图片">图片</button>
                  <button class="fr-media-btn" id="frChatVoice" type="button" title="录语音" aria-label="录语音">语音</button>
                  <button class="fr-media-btn" id="frChatFile" type="button" title="发文件" aria-label="发文件">文件</button>
                </div>
                <textarea class="fr-input fr-chat__input" id="frChatInput" rows="1" maxlength="500" placeholder="说点什么…" title="回车发送，Shift+回车换行" aria-label="输入消息，回车发送，Shift+回车换行"></textarea>
                <button class="fr-btn fr-btn--send" id="frChatSend" type="button">发送</button>
              </div>
              <div class="fr-rec" id="frRecBar" hidden>
                <span class="fr-rec__dot" aria-hidden="true"></span>
                <span class="fr-rec__label">正在录音</span>
                <span class="fr-rec__time" id="frRecTime">0:00</span>
                <button class="fr-btn fr-btn--ghost" id="frRecCancel" type="button">取消</button>
                <button class="fr-btn" id="frRecSend" type="button">发送</button>
              </div>
            </div>
          </div>

          <!-- 好友请求 -->
          <div class="fr-card" id="frPaneRequests" hidden>
            <div id="frRequests"></div>
          </div>

          <!-- 找人 -->
          <div class="fr-card" id="frPaneSearch" hidden>
            <div class="fr-search">
              <input class="fr-input" id="frQuery" type="text" maxlength="12" placeholder="输入对方的昵称" autocomplete="off">
              <button class="fr-btn" id="frSearchBtn" type="button">搜索</button>
            </div>
            <div class="fr-msg" id="frSearchMsg"></div>
            <div id="frResults"></div>
          </div>

          <!-- 发送图片 / 文件用的隐藏选择框 -->
          <input type="file" id="frImageInput" accept="image/*" hidden>
          <input type="file" id="frFileInput" hidden>
          <!-- 换群头像用的隐藏选择框 -->
          <input type="file" id="frGroupAvatarInput" accept="image/*" hidden>

          <!-- 建群 / 拉人时用的选择框（内容由脚本填，不写死） -->
          <div class="fr-modal" id="frPickWrap" hidden>
            <div class="fr-picker" id="frPicker" role="dialog" aria-modal="true" aria-label="选择好友"></div>
          </div>

          <!-- 按群号加群：内容由脚本填 -->
          <div class="fr-modal" id="frJoinWrap" hidden>
            <div class="fr-picker" id="frJoinBox" role="dialog" aria-modal="true" aria-label="加入群聊"></div>
          </div>

          <!-- 群设置：整屏抽屉，内容由脚本填（群里人人都能看，管理项按身份出现） -->
          <div class="fr-sheet" id="frGroupSheet" hidden>
            <div class="fr-sheet__box" id="frGroupSheetBox" role="dialog" aria-modal="true" aria-label="群设置"></div>
          </div>

          <!-- 看大图的全屏浮层 -->
          <div class="fr-lightbox" id="frLightbox" hidden role="dialog" aria-modal="true" aria-label="查看大图">
            <img id="frLightboxImg" alt="图片消息">
            <button class="fr-lightbox__close" id="frLightboxClose" type="button" aria-label="关闭">关闭</button>
          </div>
        </div>

      </div>
    </div>
  </section>
</main>
