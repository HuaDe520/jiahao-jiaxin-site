# 浙江嘉豪嘉欣协会 · 伪用户系统（Cloudflare Worker + D1）
#
# 邀请码不写在这里！它们通过 secret 配置，不会进仓库：
#   npx wrangler secret put USER_CODE     # 普通用户邀请码
#   npx wrangler secret put ADMIN_CODE    # 管理员邀请码

name = "jhjx-account"
main = "worker.js"
compatibility_date = "2024-11-01"

# 建库后把 database_id 填进来（npx wrangler d1 create jhjx-account）
[[d1_databases]]
binding = "DB"
database_name = "jhjx-account"
database_id = "5e8b3ff0-7358-48da-b671-57bf18cc00ad"

[observability]
enabled = true
